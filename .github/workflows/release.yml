name: Release

# A release is cut by merging a version bump: when VERSION in the wordl script has no
# matching `v<version>` tag yet, this builds the archive and publishes it.
# On pull requests that touch what a release is made of it only builds and installs,
# to prove the archive, the installer and the AUR package still work.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - install.sh
      - wordl
      - words/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        run: |
          version=$(packaging/version.sh)
          [ -n "$version" ] || { echo "::error::The wordl script has no VERSION line."; exit 1; }
          publish=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ] \
            && [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $version, publish: $publish" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the archive
        run: |
          packaging/dist.sh dist
          cd dist && sha256sum wordl-*.tar.gz | tee SHA256SUMS
      - name: Render the AUR package
        run: packaging/aur/render.sh "$VERSION" dist/SHA256SUMS dist/aur
      - name: Smoke test
        # Install from the archive just built, the way install.sh does for a user, and
        # run the installed copy from another directory through its link.
        run: |
          WORDL_RELEASE_URL="file://$PWD/dist" WORDL_HOME="$RUNNER_TEMP/share/wordl" WORDL_BIN_DIR="$RUNNER_TEMP/bin" sh install.sh
          out=$(cd / && "$RUNNER_TEMP/bin/wordl" --version)
          echo "$out"
          [ "$out" = "wordl $VERSION" ]
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          include-hidden-files: true # .SRCINFO
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish the release
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes \
            "dist/wordl-$VERSION.tar.gz" dist/SHA256SUMS dist/aur/PKGBUILD
      - name: Push to the AUR
        # Optional: runs once an AUR account's SSH key is stored as AUR_SSH_PRIVATE_KEY.
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY is not set; skipping the AUR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/wordl.git aur-repo
          cp dist/aur/PKGBUILD dist/aur/.SRCINFO dist/aur/LICENSE aur-repo/
          cd aur-repo
          git config user.name "wordl release"
          git config user.email "noreply@github.com"
          git add PKGBUILD .SRCINFO LICENSE
          git diff --cached --quiet || git commit -m "Update to $VERSION"
          git push origin HEAD:master
      - name: Ask the Homebrew tap to update
        # Optional: the tap also checks on a schedule. TAP_TOKEN is a token allowed to
        # run workflows in anwarahmed/homebrew-tap. Without it the step warns rather than
        # passing quietly, because the formula then trails the release by hours.
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            msg="TAP_TOKEN is not set, so the Homebrew tap was not told about $VERSION. It updates on its own schedule (every three hours); to update it now run: gh workflow run update.yml --repo anwarahmed/homebrew-tap"
            echo "::warning title=Homebrew tap not notified::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          GH_TOKEN="$TAP_TOKEN" gh workflow run update.yml --repo anwarahmed/homebrew-tap
          # The release is not done until Homebrew serves it: wait for the formula.
          for _ in $(seq 40); do
            sleep 15
            if gh api repos/anwarahmed/homebrew-tap/contents/Formula/wordl.rb --jq .content | base64 -d | grep -q "wordl-$VERSION.tar.gz"; then
              echo "The Homebrew formula is at $VERSION." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error title=Homebrew formula not updated::The tap was asked to update but its formula is still not at $VERSION after 10 minutes. See https://github.com/anwarahmed/homebrew-tap/actions"
          exit 1
