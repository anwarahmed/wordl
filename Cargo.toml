[package]
name = "wordl"
version = "0.2.6"
edition = "2024"
# Oldest toolchain that builds this; the `msrv` CI job keeps it true.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/anwarahmed/wordl"
description = "A Wordle-style word game for the terminal"
readme = "README.md"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ratatui = "0.30.2"
sha2 = "0.11.0"
ureq = "3.4.2"

[profile.release]
lto = true
# Keep symbol names so a panic in the field has a readable backtrace.
strip = "debuginfo"
